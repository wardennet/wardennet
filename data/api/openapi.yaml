openapi: "3.0.3"
info:
  title: WardenNet Cloud SaaS API
  version: "0.1"
  description: "WardenNet（卫枢）云端 SaaS 平台接口规范。统一响应: {code, msg, data}。错误码: 10001-10007, 20001-20002, 30001"
servers:
  - url: http://localhost:8000
  - url: https://api.wardenet.cloud
tags:
  - name: Agent 节点管理
  - name: 租户管理
  - name: 证据与威胁
  - name: 白名单
  - name: 同步
  - name: 远程指令
  - name: 申诉复核
  - name: 仪表盘
  - name: 认证
  - name: 特征值
  - name: 健康检查
paths:
  /health:
    get:
      tags: [健康检查]
      summary: 健康检查
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Success" } } } }
  /api/auth/login:
    post:
      tags: [认证]
      summary: 管理员/租户登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string, format: password } } }
      responses:
        "200": { description: 登录成功, content: { application/json: { schema: { $ref: "#/components/schemas/Success" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/agent/register:
    post:
      tags: [Agent 节点管理]
      summary: 注册 Agent 节点（同 hostname+tenant 返回原 agent_id 重置 secret）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [tenant_id, hostname, os, agent_version], properties: { tenant_id: { type: string }, hostname: { type: string }, os: { type: string }, agent_version: { type: string } } }
      responses:
        "200":
          description: 注册成功
          content:
            application/json:
              schema: { allOf: [{ $ref: "#/components/schemas/Success" }, { type: object, properties: { data: { type: object, properties: { agent_id: { type: string }, secret: { type: string }, cloud_endpoint: { type: string } } } } }] }
        "10001": { $ref: "#/components/responses/ParamInvalid" }
        "10003": { $ref: "#/components/responses/Forbidden" }
  /api/agent/heartbeat:
    post:
      tags: [Agent 节点管理]
      summary: Agent 心跳
      security: [{ AgentAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [agent_version, mode], properties: { agent_version: { type: string }, mode: { type: string, enum: [online, degraded, offline] }, ip_set_count: { type: integer }, last_sync_version: { type: integer } } }
      responses:
        "200":
          description: 心跳成功
          content:
            application/json:
              schema: { allOf: [{ $ref: "#/components/schemas/Success" }, { type: object, properties: { data: { type: object, properties: { status: { type: string }, next_heartbeat_sec: { type: integer } } } } }] }
  /api/tenant/:
    get:
      tags: [租户管理]
      summary: 租户列表
      security: [{ AdminBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { allOf: [{ $ref: "#/components/schemas/Success" }, { type: object, properties: { data: { type: object, properties: { total: { type: integer }, items: { type: array, items: { $ref: "#/components/schemas/Tenant" } } } } } }] }
    post:
      tags: [租户管理]
      summary: 创建租户
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string }, contact: { type: string }, email: { type: string, format: email } } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/tenant/{tenant_id}:
    put:
      tags: [租户管理]
      summary: 更新租户
      security: [{ AdminBearer: [] }]
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, contact: { type: string }, email: { type: string, format: email }, status: { type: string, enum: [active, disabled] } } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "10004": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [租户管理]
      summary: 删除租户
      security: [{ AdminBearer: [] }]
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "10004": { $ref: "#/components/responses/NotFound" }
  /api/tenant/config:
    patch:
      tags: [租户管理]
      summary: 更新租户配置（ALL 需 enable_internal_l1_share=true）
      security: [{ TenantBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { enable_internal_l1_share: { type: boolean }, pull_threat_level: { type: string, enum: [L2_ONLY, L2_L3, ALL] } } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "10001": { $ref: "#/components/responses/ParamInvalid" }
  /api/evidence/report:
    post:
      tags: [证据与威胁]
      summary: 上报攻击证据（一票制；新租户 72h 降权；linux_auth 默认拒绝）
      security: [{ AgentAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [events], properties: { events: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/EvidenceEvent" } }, evidence_files: { type: array, items: { type: string } } } }
      responses:
        "200":
          description: 上报结果
          content:
            application/json:
              schema: { allOf: [{ $ref: "#/components/schemas/Success" }, { type: object, properties: { data: { type: object, properties: { accepted: { type: integer }, rejected: { type: integer } } } } }] }
        "10005": { $ref: "#/components/responses/AntiPoisonFailed" }
        "10006": { $ref: "#/components/responses/RateLimited" }
  /api/admin/whitelist/:
    get:
      tags: [白名单]
      summary: 全局白名单列表
      security: [{ AdminBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { allOf: [{ $ref: "#/components/schemas/Success" }, { type: object, properties: { data: { type: object, properties: { total: { type: integer }, items: { type: array, items: { $ref: "#/components/schemas/WhitelistEntry" } } } } } }] }
    post:
      tags: [白名单]
      summary: 添加全局白名单
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhitelistInput" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "10001": { $ref: "#/components/responses/ParamInvalid" }
  /api/admin/whitelist/batch:
    post:
      tags: [白名单]
      summary: 批量添加全局白名单（单批 ≤ 500）
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [items], properties: { items: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/WhitelistInput" } } } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "10007": { $ref: "#/components/responses/WhitelistLimit" }
  /api/admin/whitelist/{ip}:
    delete:
      tags: [白名单]
      summary: 删除全局白名单
      security: [{ AdminBearer: [] }]
      parameters:
        - name: ip
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "10004": { $ref: "#/components/responses/NotFound" }
  /api/tenant/whitelist/:
    get:
      tags: [白名单]
      summary: 租户私有白名单列表
      security: [{ TenantBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { allOf: [{ $ref: "#/components/schemas/Success" }, { type: object, properties: { data: { type: object, properties: { total: { type: integer }, items: { type: array, items: { $ref: "#/components/schemas/WhitelistEntry" } } } } } }] }
    post:
      tags: [白名单]
      summary: 添加租户私有白名单（≤ 1000 条）
      security: [{ TenantBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhitelistInput" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "10007": { $ref: "#/components/responses/WhitelistLimit" }
  /api/tenant/whitelist/{ip}:
    delete:
      tags: [白名单]
      summary: 删除租户私有白名单
      security: [{ TenantBearer: [] }]
      parameters:
        - name: ip
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/sync/diff:
    get:
      tags: [同步]
      summary: 增量 Diff 同步（按 spec §5.2 过滤顺序）
      security: [{ AgentAuth: [] }]
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Diff 变更集
          content:
            application/json:
              schema: { allOf: [{ $ref: "#/components/schemas/Success" }, { type: object, properties: { data: { $ref: "#/components/schemas/DiffPayload" } } }] }
        "20002": { $ref: "#/components/responses/DiffVersionMismatch" }
  /api/sync/full:
    get:
      tags: [同步]
      summary: 全量同步快照（完整黑名单 + 白名单）
      security: [{ AgentAuth: [] }]
      responses:
        "200":
          description: 全量快照
          content:
            application/json:
              schema: { allOf: [{ $ref: "#/components/schemas/Success" }, { type: object, properties: { data: { $ref: "#/components/schemas/FullSyncPayload" } } }] }
  # ---------- V2 双层 Diff 接口（主入口） ----------
  /api/sync/v2/diff:
    post:
      tags: [同步]
      summary: 双层 Diff 同步（全局层 + 租户层，Agent 插件化主入口）
      description: |
        返回格式:
        ```json
        {
          "global": { "need_base": bool, "base_name": string, "incr_list": [] },
          "tenant": { "full_sync": bool, "tenant_seq": int, "add_black": [], "del_black": [], "whitelist_add": [], "whitelist_remove": [] },
          "server_time": int
        }
        ```
      security: [{ AgentAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string, minLength: 1, description: "租户 ID" }
                global_base: { type: string, default: "base-00000000", description: "Agent 当前持有的全局 base 名" }
                global_incr_seq: { type: integer, default: 0, minimum: 0, description: "Agent 已消费到的全局增量序号" }
                tenant_seq: { type: integer, default: 0, minimum: 0, description: "Agent 已消费到的租户增量序号" }
      responses:
        "200":
          description: 双层 Diff 变更集
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          global:
                            type: object
                            properties:
                              need_base: { type: boolean, description: "是否需要全局 base 快照" }
                              base_name: { type: string }
                              incr_list:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    incr_seq: { type: integer }
                                    add_list: { type: array, items: { type: object } }
                                    remove_list: { type: array, items: { type: string } }
                          tenant:
                            type: object
                            properties:
                              full_sync: { type: boolean }
                              tenant_seq: { type: integer }
                              add_black: { type: array, items: { type: string } }
                              del_black: { type: array, items: { type: string } }
                              whitelist_add: { type: array, items: { type: string } }
                              whitelist_remove: { type: array, items: { type: string } }
                          server_time: { type: integer }
  /api/sync/v2/heartbeat:
    post:
      tags: [同步]
      summary: Agent 心跳 + 拉取 Diff 合一接口
      description: 心跳成功后自动返回当前双层 Diff，Agent 可直接应用增量
      security: [{ AgentAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string, minLength: 1 }
                agent_id: { type: string, nullable: true }
                global_base: { type: string, default: "base-00000000" }
                global_incr_seq: { type: integer, default: 0 }
                tenant_seq: { type: integer, default: 0 }
      responses:
        "200":
          description: 心跳 + Diff 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok: { type: boolean }
                          agent_id: { type: string }
                          global: { type: object }
                          tenant: { type: object }
                          server_time: { type: integer }
  /api/sync/v2/global-snapshot:
    get:
      tags: [同步]
      summary: 全局 base 快照（need_base 触发时调用）
      security: [{ AgentAuth: [] }]
      responses:
        "200":
          description: 全局快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          base_name: { type: string }
                          add_list: { type: array, items: { type: object } }
                          remove_list: { type: array, items: { type: string } }
  /api/sync/v2/tenant-snapshot:
    get:
      tags: [同步]
      summary: 租户完整快照（full_sync 触发时调用）
      security: [{ AgentAuth: [] }]
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: string }
          description: "租户 ID，Agent 只能拉自己租户的快照"
      responses:
        "200":
          description: 租户快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tenant_seq: { type: integer }
                          add_black: { type: array, items: { type: string } }
                          del_black: { type: array, items: { type: string } }
                          whitelist_add: { type: array, items: { type: string } }
                          whitelist_remove: { type: array, items: { type: string } }
        "10002": { $ref: "#/components/responses/Unauthorized" }
  /api/admin/command/unblock:
    post:
      tags: [远程指令]
      summary: 远程一键解封
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [agent_id, ip], properties: { agent_id: { type: string }, ip: { type: string }, reason: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "10004": { $ref: "#/components/responses/NotFound" }
  /api/admin/command/cleanup:
    post:
      tags: [远程指令]
      summary: 批量清理
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ips], properties: { ips: { type: array, items: { type: string } }, agent_ids: { type: array, items: { type: string } } } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/appeal/:
    get:
      tags: [申诉复核]
      summary: 申诉列表
      security: [{ AdminBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { allOf: [{ $ref: "#/components/schemas/Success" }, { type: object, properties: { data: { type: object, properties: { total: { type: integer }, items: { type: array, items: { $ref: "#/components/schemas/Appeal" } } } } } }] }
    post:
      tags: [申诉复核]
      summary: 提交申诉
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ip, reason], properties: { ip: { type: string }, reason: { type: string }, contact: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /api/appeal/{appeal_id}:
    patch:
      tags: [申诉复核]
      summary: 复核申诉
      security: [{ AdminBearer: [] }]
      parameters:
        - name: appeal_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [approved, rejected] }, whitelist: { type: boolean }, remark: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "10004": { $ref: "#/components/responses/NotFound" }
  /api/admin/dashboard:
    get:
      tags: [仪表盘]
      summary: 管理员仪表盘
      security: [{ AdminBearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { allOf: [{ $ref: "#/components/schemas/Success" }, { type: object, properties: { data: { type: object, properties: { total_tenants: { type: integer }, total_agents: { type: integer }, total_blocked_ips: { type: integer }, total_appeals_pending: { type: integer }, recent_events: { type: array, items: { $ref: "#/components/schemas/EventSummary" } } } } } }] }
  /api/tenant/dashboard:
    get:
      tags: [仪表盘]
      summary: 租户仪表盘
      security: [{ TenantBearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { allOf: [{ $ref: "#/components/schemas/Success" }, { type: object, properties: { data: { type: object, properties: { total_agents: { type: integer }, total_blocked_ips: { type: integer }, whitelist_count: { type: integer }, recent_events: { type: array, items: { $ref: "#/components/schemas/EventSummary" } } } } } }] }
  /api/features:
    get:
      tags: [特征值]
      summary: 获取特征值（版本比对 304 缓存）
      security: [{ AgentAuth: [] }]
      parameters:
        - name: version
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { allOf: [{ $ref: "#/components/schemas/Success" }, { type: object, properties: { data: { type: object, properties: { version: { type: integer }, sensitive_paths: { type: array, items: { type: string } }, bot_user_agents: { type: array, items: { type: string } }, static_resources: { type: array, items: { type: string } }, dangerous_methods: { type: array, items: { type: string } } } } } }] }
        "304": { description: 版本未变更 }
  /api/admin/features:
    put:
      tags: [特征值]
      summary: 更新特征值
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { sensitive_paths: { type: array, items: { type: string } }, bot_user_agents: { type: array, items: { type: string } }, static_resources: { type: array, items: { type: string } }, dangerous_methods: { type: array, items: { type: string } }, reset_default: { type: boolean } } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
components:
  securitySchemes:
    AgentAuth:
      type: apiKey
      in: header
      name: X-Signature
      description: X-Agent-Id + X-Signature HMAC-SHA256 签名鉴权
    AdminBearer: { type: http, scheme: bearer, bearerFormat: JWT }
    TenantBearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
  responses:
    OK: { description: 成功, content: { application/json: { schema: { $ref: "#/components/schemas/Success" } } } }
    Unauthorized: { description: 401 未鉴权, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: 10003 越权, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: 10004 资源不存在, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    ParamInvalid: { description: 10001 参数校验失败, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    AntiPoisonFailed: { description: 10005 防投毒校验失败, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    RateLimited: { description: 10006 限流, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    WhitelistLimit: { description: 10007 白名单超限, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    DiffVersionMismatch: { description: 20002 Diff 版本不一致, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Success: { type: object, required: [code, msg], properties: { code: { type: integer, example: 200 }, msg: { type: string, example: success }, data: { nullable: true } } }
    Error: { type: object, required: [code, msg], properties: { code: { type: integer }, msg: { type: string }, data: { nullable: true } } }
