<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="100%" height="auto">
  <defs>
    <linearGradient id="bgDE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111D30;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="700" height="340" fill="url(#bgDE)" rx="12"/>

  <!-- 标题 -->
  <text x="350" y="35" text-anchor="middle" fill="#00FF88" font-size="16" font-weight="700" font-family="system-ui, sans-serif">智能多信号融合决策引擎</text>
  <text x="350" y="55" text-anchor="middle" fill="#718096" font-size="11" font-family="system-ui, sans-serif">加权模型 · Agent 最终决策 · 分级处置</text>

  <!-- ===== 三个信号源 ===== -->
  <!-- Cloud -->
  <rect x="30" y="80" width="190" height="85" fill="#00D4FF" fill-opacity="0.12" stroke="#00D4FF" stroke-width="2" rx="8"/>
  <text x="125" y="102" text-anchor="middle" fill="#00D4FF" font-size="12" font-weight="700" font-family="system-ui, sans-serif">① 云端威胁评分</text>
  <text x="125" y="122" text-anchor="middle" fill="#A0AEC0" font-size="10" font-family="system-ui, sans-serif">多租户交叉验证</text>
  <text x="125" y="138" text-anchor="middle" fill="#A0AEC0" font-size="10" font-family="system-ui, sans-serif">全网协同信号</text>
  <rect x="100" y="145" width="50" height="16" fill="#00D4FF" rx="3"/>
  <text x="125" y="157" text-anchor="middle" fill="#0A1628" font-size="10" font-weight="700" font-family="system-ui, sans-serif">× 0.4</text>

  <!-- Local -->
  <rect x="255" y="80" width="190" height="85" fill="#00CC6A" fill-opacity="0.12" stroke="#00CC6A" stroke-width="2" rx="8"/>
  <text x="350" y="102" text-anchor="middle" fill="#00CC6A" font-size="12" font-weight="700" font-family="system-ui, sans-serif">② 本地频率评分</text>
  <text x="350" y="122" text-anchor="middle" fill="#A0AEC0" font-size="10" font-family="system-ui, sans-serif">滑动窗口 QPS</text>
  <text x="350" y="138" text-anchor="middle" fill="#A0AEC0" font-size="10" font-family="system-ui, sans-serif">seenCount / EMA 基线</text>
  <rect x="325" y="145" width="50" height="16" fill="#00CC6A" rx="3"/>
  <text x="350" y="157" text-anchor="middle" fill="#0A1628" font-size="10" font-weight="700" font-family="system-ui, sans-serif">× 0.3</text>

  <!-- Detector -->
  <rect x="480" y="80" width="190" height="85" fill="#FF6B35" fill-opacity="0.12" stroke="#FF6B35" stroke-width="2" rx="8"/>
  <text x="575" y="102" text-anchor="middle" fill="#FF6B35" font-size="12" font-weight="700" font-family="system-ui, sans-serif">③ 检测器评分</text>
  <text x="575" y="122" text-anchor="middle" fill="#A0AEC0" font-size="10" font-family="system-ui, sans-serif">6 层防御 + 5 维一致性</text>
  <text x="575" y="138" text-anchor="middle" fill="#A0AEC0" font-size="10" font-family="system-ui, sans-serif">攻击特征 / 协同信号</text>
  <rect x="550" y="145" width="50" height="16" fill="#FF6B35" rx="3"/>
  <text x="575" y="157" text-anchor="middle" fill="#fff" font-size="10" font-weight="700" font-family="system-ui, sans-serif">× 0.3</text>

  <!-- 三个箭头汇合 -->
  <polygon points="125,170 121,190 129,190" fill="#00D4FF"/>
  <polygon points="350,170 346,190 354,190" fill="#00CC6A"/>
  <polygon points="575,170 571,190 579,190" fill="#FF6B35"/>

  <!-- ===== 融合引擎 ===== -->
  <rect x="130" y="195" width="440" height="60" fill="#111D30" stroke="#00FF88" stroke-width="2" rx="8"/>
  <text x="350" y="220" text-anchor="middle" fill="#00FF88" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Agent 综合决策引擎</text>
  <text x="350" y="240" text-anchor="middle" fill="#E8F5E9" font-size="12" font-family="Consolas, monospace">Score = Cloud×0.4 + Local×0.3 + Detector×0.3</text>

  <polygon points="350,260 346,280 354,280" fill="#00FF88"/>

  <!-- ===== 分级处置 ===== -->
  <rect x="30" y="285" width="200" height="40" fill="#007A3D" stroke="#00FF88" stroke-width="2" rx="6"/>
  <text x="130" y="302" text-anchor="middle" fill="#00FF88" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Score ≥ 80</text>
  <text x="130" y="318" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui, sans-serif">自动封禁（ipset drop）</text>

  <rect x="255" y="285" width="190" height="40" fill="#7A6B00" stroke="#FFC107" stroke-width="2" rx="6"/>
  <text x="350" y="302" text-anchor="middle" fill="#FFC107" font-size="12" font-weight="700" font-family="system-ui, sans-serif">50 ≤ Score ＜ 80</text>
  <text x="350" y="318" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui, sans-serif">告警（人工介入）</text>

  <rect x="470" y="285" width="200" height="40" fill="#1A2B4A" stroke="#718096" stroke-width="1" rx="6"/>
  <text x="570" y="302" text-anchor="middle" fill="#A0AEC0" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Score ＜ 50</text>
  <text x="570" y="318" text-anchor="middle" fill="#718096" font-size="10" font-family="system-ui, sans-serif">忽略（正常流量）</text>
</svg>