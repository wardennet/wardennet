<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="auto">
  <defs>
    <linearGradient id="layerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF88;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#00CC6A;stop-opacity:0.25" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="420" fill="#0A1628" rx="12"/>

  <!-- 标题 -->
  <text x="300" y="35" text-anchor="middle" fill="#00FF88" font-size="16" font-weight="700" font-family="system-ui, sans-serif">六层防御体系</text>
  <text x="300" y="55" text-anchor="middle" fill="#718096" font-size="11" font-family="system-ui, sans-serif">多层评分引擎 · 协同信号 · 防误报 · 防投毒</text>

  <!-- 六层（从下往上画） -->
  <!-- L1 -->
  <rect x="40" y="360" width="520" height="40" fill="url(#layerBg)" stroke="#007A3D" stroke-width="1" rx="4"/>
  <rect x="40" y="360" width="50" height="40" fill="#007A3D" rx="4"/>
  <text x="65" y="385" text-anchor="middle" fill="#0A1628" font-size="14" font-weight="700" font-family="system-ui, sans-serif">L1</text>
  <text x="110" y="385" fill="#E8F5E9" font-size="13" font-weight="600" font-family="system-ui, sans-serif">流量异常检测</text>
  <text x="110" y="400" fill="#718096" font-size="10" font-family="system-ui, sans-serif">QPS 突增 · 404 扫描 · 滑动窗口统计</text>

  <!-- L2 -->
  <rect x="40" y="305" width="520" height="40" fill="url(#layerBg)" stroke="#007A3D" stroke-width="1" rx="4"/>
  <rect x="40" y="305" width="50" height="40" fill="#00CC6A" rx="4"/>
  <text x="65" y="330" text-anchor="middle" fill="#0A1628" font-size="14" font-weight="700" font-family="system-ui, sans-serif">L2</text>
  <text x="110" y="330" fill="#E8F5E9" font-size="13" font-weight="600" font-family="system-ui, sans-serif">攻击特征识别</text>
  <text x="110" y="345" fill="#718096" font-size="10" font-family="system-ui, sans-serif">Bot UA · 敏感路径 · 危险方法 · SQLi/XSS/RCE 模式</text>

  <!-- L3 -->
  <rect x="40" y="250" width="520" height="40" fill="url(#layerBg)" stroke="#007A3D" stroke-width="1" rx="4"/>
  <rect x="40" y="250" width="50" height="40" fill="#00FF88" rx="4"/>
  <text x="65" y="275" text-anchor="middle" fill="#0A1628" font-size="14" font-weight="700" font-family="system-ui, sans-serif">L3</text>
  <text x="110" y="275" fill="#E8F5E9" font-size="13" font-weight="600" font-family="system-ui, sans-serif">协同信号关联</text>
  <text x="110" y="290" fill="#718096" font-size="10" font-family="system-ui, sans-serif">多特征交叉 · 5 维一致性评分 · 路径行为分析</text>

  <!-- L4 -->
  <rect x="40" y="195" width="520" height="40" fill="url(#layerBg)" stroke="#007A3D" stroke-width="1" rx="4"/>
  <rect x="40" y="195" width="50" height="40" fill="#00D4FF" rx="4"/>
  <text x="65" y="220" text-anchor="middle" fill="#0A1628" font-size="14" font-weight="700" font-family="system-ui, sans-serif">L4</text>
  <text x="110" y="220" fill="#E8F5E9" font-size="13" font-weight="600" font-family="system-ui, sans-serif">防误报机制</text>
  <text x="110" y="235" fill="#718096" font-size="10" font-family="system-ui, sans-serif">空 Referer 封顶 · 401 降权 · 良性行为豁免</text>

  <!-- L5 -->
  <rect x="40" y="140" width="520" height="40" fill="url(#layerBg)" stroke="#007A3D" stroke-width="1" rx="4"/>
  <rect x="40" y="140" width="50" height="40" fill="#FF6B35" rx="4"/>
  <text x="65" y="165" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" font-family="system-ui, sans-serif">L5</text>
  <text x="110" y="165" fill="#E8F5E9" font-size="13" font-weight="600" font-family="system-ui, sans-serif">防投毒风控</text>
  <text x="110" y="180" fill="#718096" font-size="10" font-family="system-ui, sans-serif">独家智能防投毒 · 智能去重 · 云端风控 · 动态过期</text>

  <!-- L6 -->
  <rect x="40" y="85" width="520" height="40" fill="url(#layerBg)" stroke="#00FF88" stroke-width="2" rx="4"/>
  <rect x="40" y="85" width="50" height="40" fill="#00FF88" rx="4"/>
  <text x="65" y="110" text-anchor="middle" fill="#0A1628" font-size="14" font-weight="700" font-family="system-ui, sans-serif">L6</text>
  <text x="110" y="110" fill="#00FF88" font-size="13" font-weight="600" font-family="system-ui, sans-serif">快速响应处置</text>
  <text x="110" y="125" fill="#718096" font-size="10" font-family="system-ui, sans-serif">ipset 内核封禁 · 白名单绝对优先 · ForceBlock 强制封禁</text>

  <!-- 箭头 -->
  <polygon points="300,70 295,80 305,80" fill="#00FF88"/>
  <text x="300" y="65" text-anchor="middle" fill="#00FF88" font-size="10" font-family="system-ui, sans-serif">威胁判定</text>

  <!-- 底部说明 -->
  <text x="300" y="412" text-anchor="middle" fill="#A0AEC0" font-size="10" font-family="system-ui, sans-serif">由下而上层层筛选 · 多层反误伤 · 最终内核级处置</text>
</svg>
