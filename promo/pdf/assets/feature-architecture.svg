<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="auto">
  <defs>
    <linearGradient id="bgFA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111D30;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="l1g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="l2g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="l3g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF88;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#00FF88;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <rect width="700" height="380" fill="url(#bgFA)" rx="12"/>

  <!-- 标题 -->
  <text x="350" y="35" text-anchor="middle" fill="#00FF88" font-size="16" font-weight="700" font-family="system-ui, sans-serif">三阶段特征架构</text>
  <text x="350" y="55" text-anchor="middle" fill="#718096" font-size="11" font-family="system-ui, sans-serif">可靠性分层 · 多层特征融合 · 动态热更新</text>

  <!-- ===== Layer 1 ===== -->
  <rect x="50" y="80" width="600" height="80" fill="url(#l1g)" stroke="#FF6B35" stroke-width="2" rx="8"/>
  <rect x="50" y="80" width="120" height="80" fill="#FF6B35" rx="8"/>
  <rect x="50" y="145" width="120" height="15" fill="#FF6B35"/>
  <text x="110" y="115" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Layer 1</text>
  <text x="110" y="135" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui, sans-serif">内置特征</text>
  <text x="190" y="110" fill="#E8F5E9" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Agent 编译期写入</text>
  <text x="190" y="130" fill="#A0AEC0" font-size="11" font-family="system-ui, sans-serif">危险 UA · 敏感路径 · 危险模式 · 已知爬虫</text>
  <text x="190" y="148" fill="#718096" font-size="10" font-family="system-ui, sans-serif">零外部依赖 · 100% 可信 · 永不丢失</text>
  <rect x="560" y="95" width="75" height="24" fill="#FF6B35" rx="4"/>
  <text x="597" y="112" text-anchor="middle" fill="#fff" font-size="10" font-family="system-ui, sans-serif">最高</text>

  <!-- 箭头 1→2 -->
  <polygon points="350,168 345,178 355,178" fill="#718096"/>
  <text x="350" y="175" text-anchor="middle" fill="#718096" font-size="9" font-family="system-ui, sans-serif">可靠性递减 →</text>

  <!-- ===== Layer 2 ===== -->
  <rect x="50" y="190" width="600" height="80" fill="url(#l2g)" stroke="#00D4FF" stroke-width="2" rx="8"/>
  <rect x="50" y="190" width="120" height="80" fill="#00D4FF" rx="8"/>
  <rect x="50" y="255" width="120" height="15" fill="#00D4FF"/>
  <text x="110" y="225" text-anchor="middle" fill="#0A1628" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Layer 2</text>
  <text x="110" y="245" text-anchor="middle" fill="#0A1628" font-size="10" font-family="system-ui, sans-serif">用户配置</text>
  <text x="190" y="220" fill="#E8F5E9" font-size="13" font-weight="600" font-family="system-ui, sans-serif">config.yaml 自定义</text>
  <text x="190" y="240" fill="#A0AEC0" font-size="11" font-family="system-ui, sans-serif">自定义敏感路径 · 合法客户端白名单 · 排除项</text>
  <text x="190" y="258" fill="#718096" font-size="10" font-family="system-ui, sans-serif">运维可自行调整 · 热加载无需重启</text>
  <rect x="560" y="205" width="75" height="24" fill="#00D4FF" rx="4"/>
  <text x="597" y="222" text-anchor="middle" fill="#0A1628" font-size="10" font-weight="700" font-family="system-ui, sans-serif">中等</text>

  <!-- 箭头 2→3 -->
  <polygon points="350,278 345,288 355,288" fill="#718096"/>

  <!-- ===== Layer 3 ===== -->
  <rect x="50" y="300" width="600" height="65" fill="url(#l3g)" stroke="#00FF88" stroke-width="2" rx="8"/>
  <rect x="50" y="300" width="120" height="65" fill="#00FF88" rx="8"/>
  <rect x="50" y="350" width="120" height="15" fill="#00FF88"/>
  <text x="110" y="328" text-anchor="middle" fill="#0A1628" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Layer 3</text>
  <text x="110" y="345" text-anchor="middle" fill="#0A1628" font-size="10" font-family="system-ui, sans-serif">云端下发</text>
  <text x="190" y="325" fill="#00FF88" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Diff 增量同步</text>
  <text x="190" y="343" fill="#A0AEC0" font-size="11" font-family="system-ui, sans-serif">全网最新威胁情报 · 跨租户共享可疑 IP</text>
  <text x="190" y="358" fill="#718096" font-size="10" font-family="system-ui, sans-serif">云端交叉验证 · 可靠性最高 · 增量下发最小流量</text>
  <rect x="560" y="315" width="75" height="24" fill="#00FF88" rx="4"/>
  <text x="597" y="332" text-anchor="middle" fill="#0A1628" font-size="10" font-weight="700" font-family="system-ui, sans-serif">动态</text>
</svg>