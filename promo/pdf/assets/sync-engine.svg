<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" height="auto">
  <defs>
    <linearGradient id="bgSE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111D30;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="700" height="320" fill="url(#bgSE)" rx="12"/>

  <!-- 标题 -->
  <text x="350" y="35" text-anchor="middle" fill="#00D4FF" font-size="16" font-weight="700" font-family="system-ui, sans-serif">三层 Diff 智能同步引擎</text>
  <text x="350" y="55" text-anchor="middle" fill="#718096" font-size="11" font-family="system-ui, sans-serif">Agent ↔ Cloud 威胁情报同步 · 最小化传输 · 自适应降级</text>

  <!-- ===== Agent ===== -->
  <rect x="60" y="90" width="200" height="140" fill="#00FF88" fill-opacity="0.08" stroke="#00FF88" stroke-width="2" stroke-dasharray="6,3" rx="10"/>
  <text x="160" y="115" text-anchor="middle" fill="#00FF88" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Agent（本地）</text>
  <text x="160" y="135" text-anchor="middle" fill="#A0AEC0" font-size="10" font-family="system-ui, sans-serif">Go 轻量单二进制</text>
  <line x1="80" y1="150" x2="240" y2="150" stroke="#00FF88" stroke-width="0.5" opacity="0.4"/>
  <text x="160" y="170" text-anchor="middle" fill="#E8F5E9" font-size="10" font-family="system-ui, sans-serif">记录威胁事件</text>
  <text x="160" y="188" text-anchor="middle" fill="#E8F5E9" font-size="10" font-family="system-ui, sans-serif">上报至 CloudPlugin</text>
  <text x="160" y="206" text-anchor="middle" fill="#E8F5E9" font-size="10" font-family="system-ui, sans-serif">接收 Diff Patch</text>
  <text x="160" y="224" text-anchor="middle" fill="#00FF88" font-size="10" font-family="system-ui, sans-serif">综合决策 + ipset 封禁</text>

  <!-- 连接线 -->
  <line x1="260" y1="160" x2="350" y2="160" stroke="#00FF88" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6"/>
  <polygon points="350,160 343,156 343,164" fill="#00FF88"/>
  <line x1="350" y1="175" x2="260" y2="175" stroke="#00D4FF" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6"/>
  <polygon points="260,175 267,171 267,179" fill="#00D4FF"/>

  <!-- ===== 三层 Diff ===== -->
  <rect x="360" y="85" width="280" height="150" fill="#001B3D" stroke="#00D4FF" stroke-width="2" rx="10"/>
  <text x="500" y="108" text-anchor="middle" fill="#00D4FF" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Diff Stack（Cloud 端）</text>

  <!-- Global Base -->
  <rect x="375" y="118" width="250" height="28" fill="#FF6B35" fill-opacity="0.15" stroke="#FF6B35" stroke-width="1" rx="4"/>
  <text x="500" y="136" text-anchor="middle" fill="#FF6B35" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Global Base（全量快照）</text>
  <text x="627" y="136" text-anchor="end" fill="#718096" font-size="9" font-family="system-ui, sans-serif">首次/need_base</text>

  <!-- + -->
  <text x="388" y="160" fill="#00D4FF" font-size="14" font-weight="700" font-family="system-ui, sans-serif">+</text>

  <!-- Incremental -->
  <rect x="375" y="165" width="250" height="28" fill="#00D4FF" fill-opacity="0.15" stroke="#00D4FF" stroke-width="1" rx="4"/>
  <text x="500" y="183" text-anchor="middle" fill="#00D4FF" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Incremental（增量补丁）</text>
  <text x="627" y="183" text-anchor="end" fill="#718096" font-size="9" font-family="system-ui, sans-serif">默认路径</text>

  <!-- + -->
  <text x="388" y="207" fill="#00FF88" font-size="14" font-weight="700" font-family="system-ui, sans-serif">+</text>

  <!-- Tenant Diff -->
  <rect x="375" y="212" width="250" height="18" fill="#00FF88" fill-opacity="0.15" stroke="#00FF88" stroke-width="1" rx="4"/>
  <text x="500" y="225" text-anchor="middle" fill="#00FF88" font-size="10" font-weight="600" font-family="system-ui, sans-serif">Tenant Diff（租户专属变更）</text>

  <!-- ===== 右下角说明 ===== -->
  <rect x="60" y="255" width="580" height="50" fill="#111D30" stroke="#718096" stroke-width="1" rx="6"/>
  <text x="80" y="275" fill="#A0AEC0" font-size="10" font-family="system-ui, sans-serif">传输路径：Agent → CloudPlugin → HMAC-SHA256 签名 → HTTPS → /api/agent/diff</text>
  <text x="80" y="292" fill="#718096" font-size="10" font-family="system-ui, sans-serif">降级策略：心跳超时 24h → 强制全量同步 ｜ 云端下发 need_base 标记 → 自动降级 Global Base</text>
</svg>