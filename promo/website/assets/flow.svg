<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" width="100%" height="auto">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D2818;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="700" height="160" fill="url(#flowBg)" rx="12"/>

  <!-- 步骤 1: 流量 -->
  <rect x="30" y="40" width="130" height="80" fill="#111D30" stroke="#718096" stroke-width="1" rx="8"/>
  <text x="95" y="70" text-anchor="middle" fill="#A0AEC0" font-size="11" font-weight="600" font-family="system-ui, sans-serif">① 流量输入</text>
  <text x="95" y="90" text-anchor="middle" fill="#718096" font-size="10" font-family="system-ui, sans-serif">Nginx/Apache</text>
  <text x="95" y="105" text-anchor="middle" fill="#718096" font-size="10" font-family="system-ui, sans-serif">日志文件</text>

  <!-- 箭头 1→2 -->
  <line x1="165" y1="80" x2="205" y2="80" stroke="#00FF88" stroke-width="2"/>
  <polygon points="205,80 198,76 198,84" fill="#00FF88"/>

  <!-- 步骤 2: 检测 -->
  <rect x="210" y="40" width="130" height="80" fill="url(#agentGrad)" stroke="#00FF88" stroke-width="2" rx="8"/>
  <text x="275" y="70" text-anchor="middle" fill="#00FF88" font-size="11" font-weight="600" font-family="system-ui, sans-serif">② 特征提取</text>
  <text x="275" y="90" text-anchor="middle" fill="#718096" font-size="10" font-family="system-ui, sans-serif">IP / UA / 路径</text>
  <text x="275" y="105" text-anchor="middle" fill="#718096" font-size="10" font-family="system-ui, sans-serif">方法 / Referer</text>

  <!-- 箭头 2→3 -->
  <line x1="345" y1="80" x2="385" y2="80" stroke="#00FF88" stroke-width="2"/>
  <polygon points="385,80 378,76 378,84" fill="#00FF88"/>

  <!-- 步骤 3: 评分 -->
  <rect x="390" y="40" width="130" height="80" fill="url(#agentGrad)" stroke="#00CC6A" stroke-width="2" rx="8"/>
  <text x="455" y="70" text-anchor="middle" fill="#00CC6A" font-size="11" font-weight="600" font-family="system-ui, sans-serif">③ 多层评分</text>
  <text x="455" y="90" text-anchor="middle" fill="#718096" font-size="10" font-family="system-ui, sans-serif">滑动窗口统计</text>
  <text x="455" y="105" text-anchor="middle" fill="#718096" font-size="10" font-family="system-ui, sans-serif">6 层 + 5 维</text>

  <!-- 箭头 3→4 -->
  <line x1="525" y1="80" x2="565" y2="80" stroke="#00FF88" stroke-width="2"/>
  <polygon points="565,80 558,76 558,84" fill="#00FF88"/>

  <!-- 步骤 4: 处置 -->
  <rect x="570" y="40" width="100" height="80" fill="#007A3D" stroke="#00FF88" stroke-width="2" rx="8"/>
  <text x="620" y="70" text-anchor="middle" fill="#00FF88" font-size="11" font-weight="600" font-family="system-ui, sans-serif">④ 处置</text>
  <text x="620" y="90" text-anchor="middle" fill="#A0AEC0" font-size="10" font-family="system-ui, sans-serif">拦截</text>
  <text x="620" y="105" text-anchor="middle" fill="#A0AEC0" font-size="10" font-family="system-ui, sans-serif">告警 / 忽略</text>

  <!-- 标题 -->
  <text x="350" y="28" text-anchor="middle" fill="#00FF88" font-size="12" font-weight="600" font-family="system-ui, sans-serif">威胁检测流程</text>
</svg>
